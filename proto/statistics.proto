syntax = "proto3";

package test;

option go_package = "/rpc/statistics";

service Statistics{
    // 定义get_log方法，接收Statistics_request，返回Statistics_response
    rpc get_log (Statistics_request) returns (Statistics_response);
}

// 定义Statistics_request消息体，包含一个字符串
message Statistics_request{
    string req = 1;  
}

// 定义Statistics_response消息体，包含bytes形式的log文件
message Statistics_response{  
    bytes log = 1;
}
